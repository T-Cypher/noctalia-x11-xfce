# Noctalia X11 - configuration
#
# Like noctalia v5.3.0, every *.toml file in ~/.config/noctalia-x11/ is loaded (alphabetically)
# and merged, [include] files = [...] pulls in more files or directories, and
# ~/.local/state/noctalia-x11/settings.toml is merged last. Everything is hot-reloaded.
# Without any file in ~/.config/noctalia-x11/, noctalia's own ~/.config/noctalia/ is read as-is.
#
# The schema is noctalia v5.3.0's. The values below are noctalia's defaults; delete what you do
# not change. Keys this port does not implement are ignored. X11 / XFCE specific settings live
# in [x11] at the bottom.

# ── Shell ─────────────────────────────────────────────────────────────────────

[accessibility]
ui_scale = 1.0

[shell]
font_family         = "sans-serif"
time_format         = "{:%H:%M}"        # std::format chrono syntax, or plain strftime ("%H:%M")
date_format         = "%A, %x"
corner_radius_scale = 1.0
avatar_path         = ""                # empty = ~/.face or AccountsService icon
clipboard_enabled   = true
clipboard_history_max_entries = 100
clipboard_auto_paste = "auto"           # auto | off  (pasting uses xdotool)
offline_mode        = false             # disables weather / geolocation requests
# lang = "de"                           # default: $LANG; uses noctalia's translations

[shell.animation]
enabled = true
speed   = 1.0

[shell.shadow]
direction = "down"
alpha     = 0.55

[shell.panel]
transparency_mode        = "solid"      # solid | translucent
borders                  = true
border_color             = "outline"
border_width             = 1.0
launcher_placement       = "floating"   # floating | attached
launcher_position        = "center"     # center | top | bottom | top_left | ...
clipboard_placement      = "floating"
control_center_placement = "attached"
wallpaper_placement      = "attached"
session_placement        = "attached"
open_near_click_control_center = false

[shell.launcher]
layout              = "full"            # full | simple
width               = 760
search_position     = "bottom"          # top | bottom
default_view        = "recent"          # recent | pinned | all | categories
categories          = true
show_settings_button = true
show_session_button = true
app_grid            = false
track_usage         = true
sort_by_usage       = true
pinned              = []                # desktop entry ids, e.g. ["firefox", "org.xfce.mousepad"]
provider_prefix     = "/"

[shell.launcher.providers.calculator]
prefix = "calc"
global = true

[shell.mpris]
blacklist = []                          # e.g. ["chromium"]

# [shell.session]
# grid = false
# [[shell.session.actions]]
# action = "lock"
# [[shell.session.actions]]
# action = "shutdown"
# countdown_seconds = 3
# [[shell.session.actions]]
# action = "command"
# label = "Firmware setup"
# glyph = "settings"
# command = "systemctl reboot --firmware-setup"

# ── Wallpaper ─────────────────────────────────────────────────────────────────
# Applied through xfdesktop (xfconf) on XFCE, so desktop icons keep working.

[wallpaper]
fill_mode = "crop"                      # crop | fit | stretch | center | tile
directory = ""                          # empty = XDG Pictures directory
# directory_dark  = "~/Pictures/dark"
# directory_light = "~/Pictures/light"

[wallpaper.automation]
enabled          = false
interval_seconds = 1800
order            = "random"             # random | alphabetical
recursive        = false

# ── Theme ─────────────────────────────────────────────────────────────────────

[theme]
mode    = "dark"                        # dark | light | auto (follows sunrise/sunset)
shell_mode = "follow"                   # follow | dark | light | auto (the shell's own surfaces)
source  = "builtin"                     # builtin | wallpaper
builtin = "Noctalia"                    # Ayu | Catppuccin | Dracula | Eldritch | Gruvbox |
                                        # Kanagawa | Noctalia | Nord | Rosé Pine | Tokyo-Night
pure_black_dark = false
# wallpaper_scheme = "m3-content"       # m3-tonal-spot | m3-content | m3-fruit-salad | m3-rainbow |
                                        # m3-monochrome | vibrant | faithful | soft | dysfunctional | muted

# [backdrop]
# enabled        = true                 # dim the screen behind open panels
# tint_intensity = 0.3

# ── Notifications ─────────────────────────────────────────────────────────────
# Replaces xfce4-notifyd (see scripts/xfce-setup.sh --notifications).

[notification]
enable_daemon      = true
show_app_name      = true
show_actions       = true
keep_dismissed_in_history = true
background_opacity = 0.97
border             = true
border_color       = "outline"
position           = "top_right"        # top_right | top_left | top_center | bottom_*
offset_x           = 20
offset_y           = 8
max_visible        = 0                  # 0 = as many as fit on the screen
history_retention_hours = 0             # 0 = keep history (up to 100 entries)
# monitors         = ["HDMI-1"]         # output names or make/model words; empty = all monitors
# Timeouts follow the sender: expire_timeout -1 = 6 s, 0 = until dismissed.

# [notification.filter.spotify]
# match        = "spotify"              # app name (exact or substring), desktop entry or category
# show_toast   = false
# save_history = false
# bypass_dnd   = false
# override_duration = 3000

# ── OSD ───────────────────────────────────────────────────────────────────────

[osd]
enabled       = true
position      = "top_center"            # top_center | top_right | top_left | bottom_* | center_left | center_right
orientation   = "horizontal"            # horizontal | vertical (level OSDs; uses position_vertical)
position_vertical = "top_center"
hide_delay_ms = 1400

[osd.kinds]
volume = true
brightness = true
wifi = true
bluetooth = true
power_profile = true
caffeine = true
nightlight = true
dnd = true
media = true
keyboard_layout = true
lock_keys = true

# ── Services ──────────────────────────────────────────────────────────────────

[system.monitor]
enabled = true
cpu_poll_seconds     = 2.0
memory_poll_seconds  = 2.0
network_poll_seconds = 3.0
disk_poll_seconds    = 10.0

[control_center]
sidebar = "compact"                     # full | compact | none
width   = 700
show_shortcut_labels = true
show_session_button  = true
hidden_tabs = []                        # e.g. ["monitor", "weather"]

# Up to 6 Home shortcuts: wifi | bluetooth | caffeine | nightlight | notification |
# power_profile | wallpaper | session | theme_mode | screenshot | clipboard
# [[control_center.shortcuts]]
# type = "wifi"

[weather]
enabled         = true                  # needs a [location]
refresh_minutes = 30
unit            = "metric"              # metric | imperial

[location]
auto_locate = false
address     = ""                        # e.g. "Lisbon, PT"
# latitude  = 38.72
# longitude = -9.14
# custom_schedule = true                # use sunset / sunrise instead of coordinates
# sunset  = "20:30"
# sunrise = "07:30"

[audio]
enable_overdrive = false                # allow up to 150%

[brightness]
minimum_brightness = 0.0
enable_ddcutil     = false              # external monitors over DDC/CI (needs ddcutil + i2c-dev)
sync_all_monitors  = false
# [brightness.monitor.laptop]
# match = "eDP-1"
# backlight_device = "intel_backlight"

[battery]
warning_threshold = 10                  # percent; 0 disables the low-battery warning

[nightlight]
enabled = false                         # redshift / gammastep / sct / xrandr backend
force   = false
temperature_day   = 6500
temperature_night = 4000

# Idle behaviors use the X11 screensaver idle time (XScreenSaver extension).
[idle]
pre_action_fade_seconds = 2.0           # fade the screen before an action; 0 = run immediately

[idle.behavior.lock]
timeout = 600
action  = "lock"                        # lock | screen_off | suspend | lock_and_suspend | command
enabled = false

[idle.behavior.screen-off]
timeout = 660
action  = "screen_off"
enabled = false

[idle.behavior.lock-and-suspend]
timeout = 900
action  = "lock_and_suspend"
enabled = false

# ── Bar ───────────────────────────────────────────────────────────────────────
# Every [bar.<name>] table spawns a bar on each monitor (X11 dock window with struts). Without
# any [bar.*] table, one bar with these defaults is shown.

[bar.main]
position           = "top"              # top | bottom | left | right
thickness          = 34
background_opacity = 1.0
radius             = 12
concave_edge_corners = true             # concave corners where a docked bar meets the screen
margin_ends        = 100                # inset from both ends (0 = full length)
margin_edge        = 0                  # > 0 floats the bar away from the screen edge
padding            = 14
widget_spacing     = 6
scale              = 1.0
font_scale         = 1.0
font_weight        = 500
hover_highlight    = true
show_tooltip       = true
auto_hide          = false
smart_auto_hide    = false              # hide while the workspace has windows
reserve_space      = true
capsule            = false
# capsule_fill     = "surface_variant"
# capsule_border   = "outline"

start  = ["launcher", "wallpaper", "workspaces"]
center = ["clock"]
end    = ["media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]

# Other widgets: taskbar, active_window, sysmon, keyboard_layout, lock_keys, caffeine,
# nightlight, power_profile, theme_mode, weather, screenshot, settings, spacer, text,
# custom_button, and noctalia's ready-made instances: cpu, temp, ram, network_tx, network_rx,
# output_volume, input_volume, date.

# [bar.main.monitor.laptop]
# match     = "eDP-1"                   # connector name, or a word of the monitor's make/model
# thickness = 30

# [bar.main.actions]                    # gestures for every widget on this bar
# scroll_up = "volume-up"

# [bar.main.dead_zone.actions]          # empty bar space (default: right = control center)
# middle = "exec xfce4-terminal"

# ── Widgets ───────────────────────────────────────────────────────────────────

# [widget.clock]
# format = "{:%H:%M}"                   # two lines: "{:%H:%M}\n{:%d/%m}"
# tooltip_format = "{:%A, %B %d, %Y}"

# [widget.workspaces]
# style = "regular"                     # regular | minimal | focus_hint
# labels_only_when_occupied = true

# [widget.sysmon]
# stat = "cpu_usage"                    # cpu_usage | cpu_temp | ram_pct | ram_used | swap_pct |
#                                       # disk_used_pct | disk_free | net_rx | net_tx
# visualization = "gauge"               # gauge | graph | none

# [widget.terminal]
# type    = "custom_button"
# glyph   = "terminal"
# tooltip = "Terminal"
# [widget.terminal.actions]
# left = "exec exo-open --launch TerminalEmulator"

# [widget.media.actions]
# right = "media toggle"
# scroll_up = "volume-up"

# ── Dock ──────────────────────────────────────────────────────────────────────

[dock]
enabled   = false
position  = "bottom"
icon_size = 48
magnification = true
magnification_scale = 1.45
auto_hide = false
margin_edge = 0
show_dots   = false
show_instance_count = true
pinned    = []                          # e.g. ["firefox", "org.xfce.Thunar", "xfce4-terminal"]

# ── Hooks ─────────────────────────────────────────────────────────────────────

[hooks]
# started           = "notify-send 'Noctalia' 'Shell started'"
# wallpaper_changed = "logger \"wallpaper $NOCTALIA_WALLPAPER_CONNECTOR: $NOCTALIA_WALLPAPER_PATH\""
# theme_mode_changed = "notify-send 'Theme' \"$NOCTALIA_THEME_MODE\""
# battery_percentage_changed = "logger \"battery $NOCTALIA_BATTERY_STATE $NOCTALIA_BATTERY_PERCENT%\""
# Also: colors_changed, session_locked, session_unlocked, logging_out, rebooting, shutting_down,
# wifi_enabled / wifi_disabled, bluetooth_enabled / bluetooth_disabled, battery_charging,
# battery_discharging, battery_plugged, power_profile_changed.

# ── X11 / XFCE ────────────────────────────────────────────────────────────────

[x11]
lock_command      = ""                  # empty = xflock4 > light-locker > xscreensaver > i3lock > loginctl
logout_command    = ""                  # empty = xfce4-session-logout --logout --fast
wallpaper_backend = "auto"              # auto | xfdesktop | feh | xwallpaper | hsetroot | none
terminal          = ""                  # for Terminal=true apps; empty = exo-open / x-terminal-emulator
settings_command  = ""                  # empty = open this file in mousepad / xdg-open
gtk_theme_dark    = ""                  # e.g. "Adwaita-dark"  (switched with theme mode)
gtk_theme_light   = ""                  # e.g. "Adwaita"
icon_theme_dark   = ""
icon_theme_light  = ""
screenshot_region_command = ""          # empty = xfce4-screenshooter -r / flameshot gui / maim -s
screenshot_full_command   = ""
focus_method      = "bridge"            # bridge | qt  (how panels grab keyboard focus)
paste_tool        = "xdotool"
